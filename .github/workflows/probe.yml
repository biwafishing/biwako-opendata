name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://shiga-bousai.jp/sp"; Q="day=2026-11-22&time=22:50&id2=0&id3=0&id4=0&sid=0"
          for p in "wl/wl_map01.php?$Q&id1=7" "ccwl/ccwl_list.php?$Q&id1=24"; do
            echo "=== $p"; curl -sS -m 30 -A "Mozilla/5.0" -o /tmp/o.html -w "%{http_code} %{size_download}\n" "$B/$p"
            python3 - <<'PY'
          import re,html
          s=open("/tmp/o.html",encoding="utf-8",errors="replace").read()
          b=s[s.find("<body"):]
          print(re.sub(r"\n\s*\n+","\n",re.sub(r"<[^>]+>"," ",re.sub(r"<script.*?</script>","",b,flags=re.S)))[:2500])
          for h in re.findall(r'href="([^"]+)"',b)[:80]:
              if "wl" in h or "ccwl" in h: print("LINK",h)
          PY
          done
