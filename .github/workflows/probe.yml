name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://shiga-bousai.jp/sp"; Q="day=2026-11-22&time=22:50&id2=0&id3=0&id4=0&sid=0"
          curl -sS -m 30 -A "Mozilla/5.0" -o /tmp/o.html "$B/ccwl/ccwl_list.php?$Q&id1=24"
          python3 - <<'PY'
          import re
          s=open("/tmp/o.html",encoding="utf-8",errors="replace").read()
          print("RAW-SAMPLE", re.sub(r"\s+"," ",s[s.find("際川"):][:900]))
          t=re.sub(r"<[^>]+>","\t",s[s.find("際川")-300:])
          rows=[x.strip() for x in re.split(r"\t+",t) if x.strip()]
          print(len(rows)); print(" | ".join(rows)[:6000])
          for u in re.findall(r"url\s*:\s*['\"]([^'\"]+)",s): print("AJAX",u)
          for u in re.findall(r'href="([^"]*ccwl[^"]*)"',s)[:20]: print("LINK",u)
          PY
