name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://shiga-bousai.jp/" "https://shiga-bousai.jp/sp/" "https://shiga-bousai.jp/index.php/"; do
            echo "=== $u"; curl -sS -m 30 -A "Mozilla/5.0" -o /tmp/o.html -w "%{http_code} %{size_download} %{content_type}\n" "$u"; head -c 3000 /tmp/o.html; echo
            grep -o 'href="[^"]*"' /tmp/o.html | head -60
          done
