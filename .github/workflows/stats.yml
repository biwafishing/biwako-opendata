name: stats
on:
  workflow_dispatch:
    inputs:
      days:
        description: "何日分を集計するか"
        default: "7"
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: GoatCounter 集計(ログに表示するだけ・保存しない)
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, datetime
          base = "https://biwafishing.goatcounter.com/api/v0"
          days = int(os.environ.get("DAYS") or 7)
          end = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None) + datetime.timedelta(days=1)  # 今日の分も日別に入れる
          start = end - datetime.timedelta(days=days)
          q = "?start=%s&end=%s" % (start.strftime("%Y-%m-%dT00:00:00Z"), end.strftime("%Y-%m-%dT%H:%M:%SZ"))
          def get(p):
              sep = "&" if "?" in p else "?"
              r = urllib.request.Request(base + p + sep + q[1:], headers={"Authorization": "Bearer " + os.environ["GC_TOKEN"], "Content-Type": "application/json"})
              try:
                  return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, p, e.read()[:300].decode("utf-8","replace"))
                  return {}
          print("== 期間: 直近%d日 ==" % days)
          hits = get("/stats/hits?limit=50").get("hits", [])
          print("== 日別(サイトを開いた数 / タブの切り替えを含む全体) ==")
          days_open, days_all = {}, {}
          for h in hits:
              for st in h.get("stats", []) or []:
                  d, n = st.get("day"), st.get("daily", 0) or 0
                  days_all[d] = days_all.get(d, 0) + n
                  if (h.get("path") or "").startswith("/biwako-opendata"):
                      days_open[d] = days_open.get(d, 0) + n
          for d in sorted(days_all):
              print(d, days_open.get(d, 0), days_all[d])
          print("== ページ別/タブ別 ==")
          for h in hits:
              print(h.get("count"), h.get("path"), h.get("title",""))
          print("== 参照元 ==")
          for h in get("/stats/toprefs?limit=20").get("stats", []):
              print(h.get("count"), h.get("name"))
          PY
