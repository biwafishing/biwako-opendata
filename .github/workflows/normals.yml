name: normals
on: workflow_dispatch
permissions:
  contents: write
jobs:
  n:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/make_normals.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/temp_normals.json
          git commit -m "add temp normals" || echo no-change
          git pull --rebase
          git push
